<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

/* NAVBAR */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 7%;
    background: #0c1b30;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #00d9ff;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

/* HERO */

.hero {
    text-align: center;
    padding: 80px 20px;
    background:
    radial-gradient(circle at 30% 30%, #4520a8, transparent 30%),
    radial-gradient(circle at 70% 30%, #006d91, transparent 30%);
}

.hero h1 {
    font-size: 55px;
}

.gradient {
    background: linear-gradient(
        90deg,
        #7c5cff,
        #00d9ff
    );

    color: transparent;
    background-clip: text;
}

.hero p {
    font-size: 20px;
    color: #b7c4d8;
}

/* SECTIONS */

section {
    padding: 60px 7%;
}

.title {
    text-align: center;
    font-size: 35px;
    margin-bottom: 30px;
}

/* SUBJECTS */

.subjects {

    display: grid;

    grid-template-columns:
    repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;
}

.subject {

    padding: 25px;

    background: #10223b;

    border: 1px solid #263953;

    border-radius: 15px;

    cursor: pointer;

    text-align: center;

    font-size: 20px;
}

.subject:hover {

    border-color: #00d9ff;

    transform: translateY(-4px);
}

/* QUIZ */

.quiz {

    max-width: 700px;

    margin: auto;

    background: #10223b;

    padding: 30px;

    border-radius: 20px;

    display: none;
}

.question {

    font-size: 23px;

    margin-bottom: 20px;
}

.answer {

    display: block;

    width: 100%;

    padding: 15px;

    margin: 10px 0;

    border-radius: 10px;

    border: 1px solid #30445f;

    background: #162d4a;

    color: white;

    cursor: pointer;

    text-align: left;

    font-size: 16px;
}

.answer:hover {

    background: #21466e;
}

.correct {

    background: #087f55 !important;
}

.wrong {

    background: #a62d48 !important;
}

/* XP */

.xp {

    text-align: center;

    font-size: 22px;

    margin: 20px;
}

.xp span {

    color: #00d9ff;

    font-weight: bold;
}

/* BUTTON */

button {

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    background: #7c5cff;

    color: white;

    cursor: pointer;

    font-size: 16px;
}

button:hover {

    background: #6244d6;
}

/* FOOTER */

footer {

    text-align: center;

    padding: 40px;

    color: #8291a7;

    border-top: 1px solid #263953;
}

</style>

/* =========================
   QUIZ VARIABLES
========================= */

let currentQuiz = [];

let currentQuestion = 0;

let score = 0;


/* =========================
   START QUIZ
========================= */

function startQuiz(subject) {

    const questions =
        questionBank[subject];


    /*
       Make a copy so the original
       question bank is not changed.
    */

    let available =
        [...questions];


    /*
       Shuffle questions.
       This means a different order
       can appear each time.
    */

    available.sort(
        () => Math.random() - 0.5
    );


    /*
       Select maximum 5 questions.
    */

    currentQuiz =
        available.slice(0, 5);


    currentQuestion = 0;

    score = 0;


    document.getElementById(
        "quiz"
    ).style.display = "block";


    document.getElementById(
        "quizTitle"
    ).innerText =
        "📝 " + subject + " Quiz";


    document.getElementById(
        "quiz"
    ).scrollIntoView({
        behavior: "smooth"
    });


    showQuestion();

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    const q =
        currentQuiz[currentQuestion];


    document.getElementById(
        "question"
    ).innerText =

        "Question " +

        (currentQuestion + 1) +

        " of " +

        currentQuiz.length +

        "\n\n" +

        q.q;


    const answers =
        document.getElementById(
            "answers"
        );


    answers.innerHTML = "";


    document.getElementById(
        "feedback"
    ).innerText = "";


    q.a.forEach(
        (answer, index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerText =
                answer;


            button.onclick =
                () => checkAnswer(
                    index
                );


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(index) {

    const q =
        currentQuiz[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    buttons.forEach(
        button =>
            button.disabled = true
    );


    if(index === q.correct) {

        buttons[index]
            .classList.add(
                "correct"
            );


        score++;

        xp += 10;


        document.getElementById(
            "xp"
        ).innerText = xp;


        document.getElementById(
            "feedback"
        ).innerText =
            "✅ Correct! +10 XP ⭐";

    }

    else {

        buttons[index]
            .classList.add(
                "wrong"
            );


        buttons[q.correct]
            .classList.add(
                "correct"
            );


        document.getElementById(
            "feedback"
        ).innerText =
            "❌ Incorrect. No XP this time.";

    }


    setTimeout(
        nextQuestion,
        1200
    );

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    currentQuestion++;


    if(
        currentQuestion
        <
        currentQuiz.length
    ) {

        showQuestion();

    }

    else {

        finishQuiz();

    }

}


/* =========================
   FINISH QUIZ
========================= */

function finishQuiz() {

    document.getElementById(
        "question"
    ).innerText =
        "🎉 Quiz Complete!";


    document.getElementById(
        "answers"
    ).innerHTML =

        "<h3>" +

        "Score: " +

        score +

        "/" +

        currentQuiz.length +

        "</h3>";


    document.getElementById(
        "feedback"
    ).innerText =

        "⭐ You earned XP for your correct answers!";

}
